name: 'Get Next Version'
description: 'Calculate the next version number based on git tags and source code changes.'
author: 'Igor Bari'

branding:
  icon: 'tag'
  color: 'blue'

inputs:
  prefix:
    description: 'Tag prefix (e.g. "v" produces tags like v-1, v-2)'
    required: true
  src:
    description: 'Source directory to check for changes'
    required: false
    default: '.'
  ignore:
    description: 'Space-separated list of paths to ignore when detecting changes'
    required: false
    default: ''

outputs:
  version:
    description: 'The next version number when changed, or the current reachable release version when unchanged'
    value: ${{ steps.compute.outputs.version }}
  tag:
    description: 'The selected version tag including prefix (e.g. "v-2")'
    value: ${{ steps.compute.outputs.tag }}
  hasNextVersion:
    description: 'Whether a new version should be released (true/false)'
    value: ${{ steps.compute.outputs.hasNextVersion }}

runs:
  using: 'composite'
  steps:
    - name: Calculate version with bundled Rust binary
      id: compute
      shell: bash
      env:
        INPUT_PREFIX: ${{ inputs.prefix }}
        INPUT_SRC: ${{ inputs.src }}
        INPUT_IGNORE: ${{ inputs.ignore }}
        ACTION_PATH: ${{ github.action_path }}
        ACTION_RUNNER_OS: ${{ runner.os }}
        ACTION_RUNNER_ARCH: ${{ runner.arch }}
      run: bash "$ACTION_PATH/scripts/run.sh"
